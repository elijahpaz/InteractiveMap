name: Refresh published port data

# Both ports refresh themselves here, and the commit this produces triggers the
# normal Pages deploy. No server, no key, no scraping.
#
#   Long Beach  CargoNav's chart API (core-api.port-scih.com) is open and
#               server-fetchable, and publishes measured per-terminal gate turn
#               time plus daily truck transaction counts.
#   Los Angeles appointment fulfilment, published as a plain PDF.
#
# One thing is still not automated: the Long Beach gate CALENDAR, which is
# rendered client-side from api.bluecargo.io (401 without a commercial key)
# behind bot protection on polb.com (403 to any automated request). That stays a
# dated snapshot, and the app shows its age. It only supplies open/closed; the
# congestion figures come from CargoNav and are live.
on:
  schedule:
    - cron: '0 15 * * 1-5' # 08:00 Pacific, weekdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-port-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Long Beach operating data (CargoNav)
        run: node scripts/fetch_cargonav.mjs

      - name: Fetch Los Angeles appointment fulfilment
        run: python3 scripts/fetch_pola_gate_success.py
        continue-on-error: true # POLA posts on weekdays only

      - name: Commit if the published figures moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cargonav.js src/data/polaGateSuccess.js
          if git diff --staged --quiet; then
            echo "No change in published data."
          else
            git commit -m "Refresh published port data"
            git push
          fi
